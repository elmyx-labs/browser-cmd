[package]
name = "browser-cmd"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "A real Chrome for AI agents, driven from the shell: one binary, a warm daemon, and the page as an accessibility tree with refs"
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"
keywords = ["browser", "chrome", "cdp", "agent", "cli"]
categories = ["command-line-utilities", "development-tools", "web-programming"]

[[bin]]
name = "browser-cmd"
path = "src/main.rs"

[dependencies]
getrandom = "0.4"
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
percent-encoding = "2"
regex = "1"
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1", features = ["fs", "io-std", "io-util", "macros", "net", "process", "rt", "signal", "sync", "time"] }
tokio-tungstenite = "0.30"
url.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio = { version = "1", features = ["test-util"] }
