[workspace]
members = ["crates/browser-cmd"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "Apache-2.0"
repository = "https://github.com/elmyx-labs/browser-cmd"
homepage = "https://github.com/elmyx-labs/browser-cmd"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
url = "2"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
