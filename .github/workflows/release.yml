name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  # The agent skill shipped in each archive as skills/browser-cmd/SKILL.md (installed for Codex by install.sh).
  SKILL: plugin/skills/browser-cmd/SKILL.md

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm }
          - { target: x86_64-apple-darwin, os: macos-latest }
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: The tag is the crate version
        run: test "${GITHUB_REF_NAME#v}" = "$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml)"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        run: |
          name=browser-cmd-${{ matrix.target }}
          mkdir -p "$name/skills/browser-cmd"
          cp LICENSE README.md "$name/"
          cp "$SKILL" "$name/skills/browser-cmd/SKILL.md"
          if [ "$RUNNER_OS" = Windows ]; then
            cp "target/${{ matrix.target }}/release/browser-cmd.exe" "$name/"
            7z a "$name.zip" "$name"
          else
            cp "target/${{ matrix.target }}/release/browser-cmd" "$name/"
            tar -czf "$name.tar.gz" "$name"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: browser-cmd-${{ matrix.target }}.*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum browser-cmd-* > SHA256SUMS
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
