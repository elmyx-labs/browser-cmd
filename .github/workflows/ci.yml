name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  # The release runs these same checks before it builds anything.
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.92.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # Tests that need Chrome are #[ignore]d and do not run here.
      - run: cargo test --workspace --locked

  chrome:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
          # On a hosted Linux runner a crashed page is never reported as crashed: its tab is found
          # hung and replaced instead. The two tests of the crash report wait for a Linux machine.
          - os: ubuntu-latest
            skip: --skip a_crashed_tab_is_said --skip real_chrome_says_a_page_crashed
          # Windows is not there yet: downloads go unreported and paths are printed with both
          # separators. The job says how far it is and does not hold a change back.
          - os: windows-latest
            unfinished: true
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.unfinished || false }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.92.0
      - uses: Swatinem/rust-cache@v2
      # The runner's own Chrome, on the fixtures the tests serve.
      - run: cargo test --workspace --locked -- --include-ignored --skip public_ ${{ matrix.skip }}
        env:
          BROWSER_CMD_HEADLESS: 1

  packaging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The plugin version is the crate version
        run: test "$(jq -r .version plugin/.claude-plugin/plugin.json)" = "$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml)"
      - name: The installer is valid POSIX sh
        run: sh -n install.sh
